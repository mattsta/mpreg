[project]
name = "mpreg"
version = "0.3.1"
description = "Matt’s Protocol for Results Everywhere Guaranteed"
authors = [{ name = "Matt Stancliff", email = "matt@genges.com" }]
requires-python = " >=3.11,<4"
readme = "README.md"
license = "Apache-2.0"
keywords = ["distributed", "rpc", "pubsub", "raft", "fabric", "cache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.14",
    "orjson>=3.9.7",
    "websockets>=12.0",
    "loguru>=0.7.3",
    "ulid-py>=1.1.0",
    "jsonargparse>=4.24.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.0.0",
    "pympler>=1.1",
    "click>=8.1.0",
    "rich>=13.7.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.10.0",
    "cryptography>=45.0.5",
    "sortedcontainers>=2.4.0",
    "aiosqlite>=0.21.0",
    "dnslib>=0.9.24",
]

[project.scripts]
mpreg = "mpreg.cli:main"
mpreg-example = "mpreg.examples.apps._shared.runner:main"

[project.urls]
Homepage = "https://github.com/mattstancliff/mpreg"
Documentation = "https://github.com/mattstancliff/mpreg/tree/main/docs"
Repository = "https://github.com/mattstancliff/mpreg"
Changelog = "https://github.com/mattstancliff/mpreg/blob/main/CHANGELOG.md"
"Release 0.3.0" = "https://github.com/mattstancliff/mpreg/blob/main/docs/RELEASE_0_3_PRODUCTION_SNAPSHOT_ARCHITECTURE.md"
"Security" = "https://github.com/mattstancliff/mpreg/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "ruff>=0.12.2",
    "mypy>=1.16.1",
    "pytest>=8.2.2",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.6",
    "types-psutil>=7.0.0.20250601",
    "psutil>=6.1.0",
    "pytest-xdist>=3.8.0",
    "types-aiofiles>=24.1.0.20250708",
    "pytest-cov>=6.2.1",
    "hypothesis>=6.136.0",
    "networkx>=3.5",
    "types-networkx>=3.5.0.20250712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = [
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
  "SIM",
  "PTH",
  "FURB",
  "PGH",
  "F401"
]
ignore = [
  "E402",  # Module level import not at top of file
  "PGH003", # Allow generic type: ignore for third-party libraries without stubs
  "SIM102", # ignore: "don't allow nested if statements"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Configure test markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "chaos: cross-plane chaos scenarios (DS validation)",
    "example_apps: curriculum example apps (live servers, real workloads)",
    "example_smoke: curriculum smoke-bundle apps (CI-friendly)",
    "example_suite: full curriculum suite apps",
]
# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Concurrent testing with pytest-xdist
addopts = [
    "--tb=short",           # Shorter traceback format
    "--strict-markers",     # Strict marker enforcement
    "--disable-warnings",   # Disable warnings during test runs
]

[tool.mypy]
python_version = "3.14"
# Curriculum app dirs use numeric prefixes (invalid pkg names for mypy).
exclude = [
  "mpreg/examples/apps/",
  "^mpreg/examples/apps/",
]
check_untyped_defs = true
disallow_untyped_defs = true
pretty = true
show_traceback = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["mpreg"]

[tool.hatch.build]
include = [
  "mpreg/**",
  "mpreg/profiles/*.toml",
  "mpreg/profiles/README.md",
  "mpreg/core/error_codes.json",
  "mpreg/ops/*",
  "mpreg/server_pkg/consensus.md",
]
