      - tests/testing/test_distlab_audit_scenarios.py
      - tests/testing/test_distlab_registry.py
      - tests/testing/test_distlab_live.py
  - id: INV-CACHE-STRONG-01
    claim: >
      When cache_strong_enabled, GlobalCacheManager ConsistencyLevel.STRONG put
      uses a majority-commit barrier (Q = floor(N/2)+1 COMMIT_ACKs, origin-commit-last);
      failed puts ABORT-uncommit peer+origin L1 for op_id (residual-free). Peer
      commits bridge into GCM L1 (on_visible_apply) so gcm.get works on every
      committer. Expired pending rejects commit (reason=expired); server runs
      best-effort pending purge loop. Multi-origin LWW bumps logical_ts above
      local visible version. Disabled path remains error_code 1012. Operational
      codes 1015–1018. Pending invisible; LWW abort-safe; concurrent puts leave
      no dirty pending. Live 3-node ServerCacheTransport RR + peer-loss residual
      + multi-origin concurrent keys + STRONG/audit coexistence on same-host mesh.
      Chaos harness: partition/heal/drop/delay/dup. Bounded single-key history
      checker (not Jepsen). Adversarial ACK / handler fuzz fail-closed (not BFT).
      STRONG get/delete always refuse 1012 (quorum get/delete v1.1); local RYW
      after put uses EVENTUAL/WEAK get. capabilities flags deny get/delete quorum.
      CFT only: ABORT is best-effort (aborts_peer_ok/fail); partial peer COMMIT +
      lost ABORT may leave peer L1 (not residual-free). pending_ttl_clears_residual_l1
      is false — purge_expired_pending does not uncommit residual L1. Orphan
      pre-commit backups are GC'd; residual L1 itself is not. LWW success put can
      overwrite residual (not reliable ABORT). Caps: cft_only, abort_best_effort.
      abort_fail_peers / last_abort_fail_peers expose CFT residual candidates
      (ops diagnostics only — not residual-free proof, not auto-heal).
      retry_abort re-delivers ABORT best-effort when network recovers (ops-driven;
      not automatic background heal; still CFT).
    proof: [L1, L2, L4]
    tests:
      - tests/core/test_cache_strong.py
      - tests/core/test_cache_strong_gcm.py
      - tests/core/test_cache_strong_gcm_bridge.py
