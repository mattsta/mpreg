    proof: [L1, L2]
    tests:
      - tests/invariants/test_rpc_modality.py
      - tests/invariants/test_rpc_deadline_hops.py
  - id: INV-P3
    claim: "soft-RT mode does not retry past remaining deadline"
    proof: [L1]
    tests:
      - tests/invariants/test_rpc_modality.py
  - id: INV-P4
    claim: "stream final implies no further partials (oracle)"
    proof: [L1]
    tests:
      - tests/invariants/test_rpc_modality.py
  - id: INV-P5
    claim: "intermediate level indices strictly increasing (oracle)"
    proof: [L1]
    tests:
      - tests/invariants/test_rpc_modality.py
  - id: INV-P6
    claim: "outbound traceparent is stored on route decisions and filterable"
    proof: [L1]
    tests:
      - tests/invariants/test_trace_decisions.py
  - id: INV-P7
    claim: "federated announcement u-ids do not double-apply under retry (dedup)"
    proof: [L1]
    tests:
      - tests/invariants/test_rpc_dedup.py

encapsulation:
  - id: INV-E1
    claim: "mpreg.consensus is the single strong-consensus facade"
    proof: [L1]
    tests:
      - tests/invariants/test_consensus_facade.py
  - id: INV-E2
    claim: "/mgmt/v1/raft exposes term/role/commit when raft registered"
    proof: [L1]
    tests:
      - tests/invariants/test_raft_mgmt.py
  - id: INV-E3
    claim: "doctor --deep probes raft and link-state"
    proof: [L1]
    tests:
      - tests/invariants/test_doctor_deep.py
  - id: INV-E4
    claim: "profiles encode safe modality defaults (dev / federated / soft-rt)"
    proof: [L1]
    tests:
      - tests/invariants/test_settings_profiles_ds.py

non_claims:
  - "Full OSPF adjacency FSM / LSA flooding reliability"
  - "Full BGP RIB / communities ecosystem"
  - "Byzantine fault tolerant consensus (Raft is CFT)"
  - "Hard real-time (only soft-RT fail-closed deadlines)"
  - "Joint consensus membership until implemented (API hard-fails)"
  - "Queue global consensus / Byzantine detection is not BFT or payload-digest quorum"
  - "location_consistency.ConsistencyLevel.STRONG is not a production guarantee (fail-closed)"
  - "blockchain DeliveryGuarantee.EXACTLY_ONCE is unsupported (fail-closed)"
  - "fabric DeliveryGuarantee.EXACTLY_ONCE is unsupported_delivery until idempotent path exists"
  - "MembershipProtocol (SWIM) is library-only until wired into MPREGServer"
  - "Hub hierarchy / hub registry are library-only until wired as the default MPREGServer membership plane"
  - "federation_resilience health/recovery is not a production control loop (probes unimplemented)"
  - "Gossip envelopes are unsigned by default; fabric_gossip_require_hmac enables envelope HMAC (not PKI / not route signing)"
  - "Fabric snapshot restore is best-effort, not crash-atomic multi-store"
  - "No Jepsen-class concurrent linearizability checker for Raft"
