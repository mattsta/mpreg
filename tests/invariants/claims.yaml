  - id: INV-SHARED-AUDIT-01
    claim: >
      When mgmt_audit_shared_enabled, SharedAuditStore is a cluster G-Set of
      management mutations with per-origin retention watermarks; scope=cluster
      on GET /mgmt/v1/audit returns the merged window after anti-entropy
      (DELTA epidemic + digest/PULL unicast). Merge is commutative/idempotent;
      watermarks monotonic; no resurrection below watermark; cross-cluster reject;
      gossip_eligible=false never leaves origin. Live multi-origin drain + late
      joiner backfill converge over real fabric gossip (same-host mesh).
      In-process partition/heal + duplicate DELTA + outbound drop counters proven.
      Ops honesty: /metrics/shared-audit and config-check advertise capabilities
      with gset_epidemic when enabled and always-false siem/bft/infinite_retention/
      linearizable_cluster_ops/multi_tenant_beyond_cluster_id; doctor fails closed
      on dishonest claims. Not SIEM, not BFT, not infinite retention.
    proof: [L1, L2, L4]
    tests:
      - tests/server_pkg/test_shared_audit_store.py
      - tests/server_pkg/test_shared_audit_replicator.py
      - tests/server_pkg/test_shared_audit_response.py
