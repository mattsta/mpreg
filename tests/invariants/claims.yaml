non_claims:
  - "Atomic multi-store fabric snapshot save (catalog+keys single blob); restore has COR-10 rollback on key failure"
  - "Full OSPF adjacency FSM / LSA flooding reliability"
  - "Full BGP RIB / communities ecosystem"
  - "Byzantine fault tolerant consensus (Raft is CFT)"
  - "Hard real-time (only soft-RT fail-closed deadlines)"
  - "Joint consensus membership until implemented (API hard-fails)"
  - "Queue global consensus / Byzantine detection is not BFT or payload-digest quorum"
  - "location_consistency.ConsistencyLevel.STRONG is not a production guarantee (fail-closed; separate from GlobalCacheManager majority-commit path)"
  - "GlobalCacheManager STRONG get/delete are not majority quorum reads/writes (put-only MVP)"
  - "STRONG put is not WAN multi-region SLA, not BFT, not fsync/disk durability across replicas"
  - "STRONG put residual proofs use process stop + drop injectors — not kernel/iptables partitions or OS kill -9 + cold restart durability"
  - "Bounded single-key STRONG history checker is not Jepsen/Elle WAN linearizability"
  - "Adversarial STRONG peer tests prove fail-closed ACKs only — not Byzantine fault tolerance under a quorum of liars"
  - "STRONG pending TTL purge is best-effort wall-clock GC — not Byzantine time sync or crash-restart durability"
  - "STRONG pending TTL purge does not clear residual L1 after COMMIT apply (pending already gone; not residual GC)"
  - "Partial peer COMMIT apply + lost ABORT may leave peer L1 — ABORT best-effort CFT limit (not residual-free, not BFT)"
  - "LWW overwrite of a CFT residual peer L1 is ordinary majority success put — not reliable ABORT delivery"
  - "Orphan pre-commit backup GC drops backups only — not residual L1 clear"
  - "abort_fail_peers / last_abort_fail_peers list CFT residual candidates only — not residual-free proof and not automatic residual heal"
  - "retry_abort is ops-driven CFT best-effort re-ABORT — not automatic background heal, not residual-free while ABORT still lost, not BFT"
  - "retry_abort_ops_driven capability is honesty (always true) — not a toggle that enables automatic residual heal"
  - "mpreg.cache.strong_retry_abort / MPREGClient.cache_strong_retry_abort is ops-driven CFT RPC — not automatic residual heal, not BFT, not WAN orchestration"
  - "mpreg client cache-strong-retry-abort is ops-driven CFT CLI smoke — not automatic residual heal, not BFT, not SIEM orchestration"
  - "Live client RPC retry_abort e2e seeds residual via backend prepare+commit — not kernel partition / kill -9 / WAN proof"
  - "Product-doc residual honesty scan is bounded string checks on known paths — not full-corpus NLP proof of every historical plan doc"
  - "cache_strong_retry_abort locs pin is ordinary RPC resource routing — not quorum membership, not residual-free guarantee, not auto-heal"
  - "mpreg_strong_cap_retry_abort_ops_driven is honesty gauge (always 1) — not a toggle that enables automatic residual heal"
  - "OpenAPI PlatformCacheRpcCatalog documents wire FQNs — not an HTTP invoke path, not SIEM orchestration, not auto-heal"
  - "retry_abort self-target peers=[self] is RPC fan-in local.abort correctness — not automatic residual heal, not BFT, not WAN"
  - "Doctor/monitor residual ops hint (abort_fail_op_id + cache-strong-retry-abort guidance) is operator remediation after recovery — not automatic heal, not SIEM, not residual-free proof"
  - "DistLab strong.cft_gcm_retry_abort_clears_residual proves GCM library surface only — not automatic heal, not BFT, not WAN"
  - "residual_ops_hint JSON/metrics field is operator remediation guidance string — not automatic heal toggle, not SIEM, not residual-free proof"
  - "Hypothesis GCM.strong_retry_abort property is in-process library surface — not kernel partition, kill -9, WAN, or automatic heal"
  - "Curriculum residual_ops_hint ops-loop step is teachable guidance — not live residual clear, not automatic heal, not SIEM"
  - "strong-core/ci-core membership gate is DistLab preset coverage — not Jepsen/Elle/WAN, not residual-free product claim"
  - "Live residual_ops_hint scrape is same-host multi-process — not WAN SLA; empty hint is not residual-free under lost ABORT elsewhere"
  - "Doctor prefer server residual_ops_hint is presentation consistency — not SIEM orchestration, not automatic heal"
  - "residual_ops_hint key enrichment from recent_abort_fails is process-local best-effort — not durable audit/SIEM, not multi-tenant isolation proof, not automatic heal"
  - "Live residual_ops_hint enriched e2e seeds coordinator abort-fail diagnostics + peer prepare/commit residual — not kernel drop injectors, not WAN, not automatic heal"
  - "OpenAPI residual_ops_hint example is documentation of wire/metrics shape — not HTTP invoke, not SIEM, not auto-heal"
  - "DistLab strong.cft_residual_ops_hint_enriched proves guidance surface only — does not clear residual, not automatic heal, not BFT/WAN"
  - "Hypothesis format_residual_ops_hint enrichment is pure string formatting — not live mesh, not automatic heal, not SIEM"
