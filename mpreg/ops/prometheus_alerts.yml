groups:
  - name: mpreg_golden_signals
    rules:
      - alert: MPREGFederationHealthDegraded
        expr: mpreg_federation_health_score < 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MPREG federation health degraded"
          description: "Health score {{ $value }} on {{ $labels.cluster_id }}"
      - alert: MPREGFederationHealthCritical
        expr: mpreg_federation_health_score < 0.6
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MPREG federation health critical"
      - alert: MPREGMonitoringDown
        expr: up{job=~".*mpreg.*"} == 0 or absent(mpreg_info)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MPREG monitoring scrape target down"
      - alert: MPREGRouteBlackholeSpike
        expr: increase(mpreg_route_blackhole_total[5m]) > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated fabric route blackhole decisions"
      - alert: MPREGRPCLatencyP95High
        expr: histogram_quantile(0.95, sum(rate(mpreg_rpc_latency_ms_bucket[5m])) by (le, cluster_id)) > 250
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MPREG RPC p95 latency high"
      - alert: MPREGGossipPendingDrops
        expr: increase(mpreg_gossip_pending_drops_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gossip pending queue dropping messages (storm loss)"

  # STRONG / shared-audit lab signals — process-local; NOT WAN multi-region SLOs.
  # Capability gauges (mpreg_*_cap_*) are honesty advertisements (0/1), not alerts.
  - name: mpreg_strong_shared_audit
    rules:
      - alert: MPREGStrongPendingElevated
        expr: mpreg_strong_pending > 64
        for: 5m
        labels:
          severity: warning
          scope: lab_process_local
        annotations:
          summary: "STRONG pending prepares elevated (process-local)"
          description: >-
            pending={{ $value }} on {{ $labels.cluster_id }}. Lab/process signal only —
            not a WAN multi-region SLA. See docs/ops/STRONG_AND_SHARED_AUDIT_RUNBOOK.md.
      - alert: MPREGSharedAuditPublishDrops
        expr: increase(mpreg_shared_audit_publish_dropped_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          scope: lab_process_local
        annotations:
          summary: "Shared audit publish drops (bounded G-Set, not SIEM)"
          description: >-
            publish_dropped increased on {{ $labels.cluster_id }}. Not a SIEM backlog
            alert; epidemic outbound pressure only. Not BFT / not infinite retention.
      - alert: MPREGStrongCapGetQuorumClaimed
        # Fail-closed if a scrape ever advertises get quorum (v1 must be 0).
        expr: mpreg_strong_cap_get_quorum > 0
        for: 0m
        labels:
          severity: critical
          scope: honesty
        annotations:
          summary: "STRONG dishonestly claims get_quorum (must be 0 in v1)"
          description: "v1 put-only MVP — get quorum is v1.1. Investigate metrics builder."
      - alert: MPREGStrongCapDeleteQuorumClaimed
        expr: mpreg_strong_cap_delete_quorum > 0
        for: 0m
        labels:
          severity: critical
          scope: honesty
        annotations:
          summary: "STRONG dishonestly claims delete_quorum (must be 0 in v1)"
          description: "v1 put-only MVP — delete quorum is v1.1. Investigate metrics builder."
      - alert: MPREGStrongCapCftOnlyMissing
        # Fail-closed if a scrape advertises non-CFT (must be 1 in v1).
        expr: mpreg_strong_cap_cft_only == 0
        for: 0m
        labels:
          severity: critical
          scope: honesty
        annotations:
          summary: "STRONG dishonestly omits cft_only (must be 1 in v1)"
          description: >-
            v1 is CFT only — not BFT. Gauge must stay 1. Investigate metrics builder.
      - alert: MPREGStrongCapAbortBestEffortMissing
        expr: mpreg_strong_cap_abort_best_effort == 0
        for: 0m
        labels:
          severity: critical
          scope: honesty
        annotations:
          summary: "STRONG dishonestly claims reliable ABORT (must stay best-effort)"
          description: >-
            Lost ABORT after partial COMMIT can leave peer L1 (CFT limit). Gauge must stay 1.
      - alert: MPREGStrongCapPendingTtlClearsResidualClaimed
        expr: mpreg_strong_cap_pending_ttl_clears_residual_l1 > 0
        for: 0m
        labels:
          severity: critical
          scope: honesty
        annotations:
          summary: "STRONG dishonestly claims pending TTL clears residual L1"
      - alert: MPREGStrongAbortFailPeersPresent
        expr: mpreg_strong_abort_fail_peers > 0
        for: 5m
        labels:
          severity: info
          scope: lab_process_local
        annotations:
          summary: "STRONG CFT residual candidates present (ops guidance)"
          description: "Use residual_ops_hint / cache-strong-retry-abort after recovery. Not auto-heal."
          description: >-
            purge_expired_pending only drops uncommitted prepares — not residual L1 after COMMIT apply.
      - alert: MPREGStrongCapRetryAbortOpsDrivenMissing
        expr: mpreg_strong_cap_retry_abort_ops_driven == 0
        for: 0m
        labels:
          severity: critical
          scope: honesty
        annotations:
          summary: "STRONG dishonestly omits ops-driven retry_abort (must be 1)"
          description: >-
            strong_retry_abort is ops-driven CFT best-effort — not automatic background heal. Gauge must stay 1.
      - alert: MPREGSharedAuditCapSiemClaimed
        expr: mpreg_shared_audit_cap_siem > 0
        for: 0m
        labels:
          severity: critical
          scope: honesty
        annotations:
          summary: "Shared audit dishonestly claims SIEM capability"
          description: "Shared audit is a bounded G-Set epidemic — never a SIEM."
      - alert: MPREGSharedAuditCapBftClaimed
        expr: mpreg_shared_audit_cap_bft > 0
        for: 0m
        labels:
          severity: critical
          scope: honesty
        annotations:
          summary: "Shared audit dishonestly claims BFT capability"
          description: "CFT gossip only — not BFT."
