# Local development — single node, four-plane façade ready (RPC+pubsub+queue+cache).
# Route/gossip signing stay relaxed for laptop use; use federated.toml for secure defaults.
[mpreg]
name = "dev-node"
cluster_id = "dev-cluster"
host = "127.0.0.1"
# port omitted → auto-allocate
monitoring_enabled = true
monitoring_enable_cors = false
enable_default_cache = true
enable_default_queue = true
fabric_routing_enabled = true
gossip_interval = 2.0
log_level = "INFO"
